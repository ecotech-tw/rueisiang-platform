name = "rueisiang-platform"
main = "src/worker.ts"
compatibility_date = "2026-08-01"
workers_dev = true
keep_vars = true

# 靜態檔與 API 同一個 Worker、同一個網域。
# 這組設定沿用出金表工具 worker/wrangler.toml 已驗證可行的做法：
# 所有 hostname 先進 Worker：CDN 只提供公開圖片與據點快照，platform 的非 API 路徑再交給 ASSETS。
# not_found_handling 讓 React Router 的 client-side 路由重新整理時不會 404。
[assets]
directory = "../portal/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# 建立方式：npx wrangler d1 create rueisiang-platform
# 產生的 database_id 貼回這裡（這個值不是機密，可以進版控）。
[[d1_databases]]
binding = "DB"
database_name = "rueisiang-platform"
database_id = "51443700-c187-4ddb-868b-6b88d7ea43f1"
migrations_dir = "../../packages/db/migrations"

# 倉位現場照片。建立方式：npx wrangler r2 bucket create rueisiang-platform-uploads
# 照片本身放這裡，D1 的 zone_images 只存索引（object_key、檔名、大小）。
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "rueisiang-platform-uploads"

# media bucket 保持私有，由同一 Worker 的 CDN hostname 提供公開圖片與據點快照。
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "media"

[[routes]]
pattern = "cdn.rueisiang.com"
custom_domain = true

# LINE webhook 只把工作寫入 Queue；consumer 優先使用 Reply token，逾時才走每月 200 人的受限 Push。
# 第一次部署前先建立一次：npx wrangler queues create rueisiang-line-assistant
[[queues.producers]]
binding = "LINE_ASSISTANT_QUEUE"
queue = "rueisiang-line-assistant"

[[queues.consumers]]
queue = "rueisiang-line-assistant"
max_batch_size = 1
max_batch_timeout = 0
# max_concurrency 只是降低外部服務壓力；同一個對話的正確順序由 D1 sequence gate 保證，
# 因為 Queue retry 可能讓較早的訊息晚於後續訊息重新投遞。quota 正確性另外由 D1 atomic reservation 保證。
max_concurrency = 1
max_retries = 3
dead_letter_queue = "rueisiang-line-assistant-dlq"

# 薪資只把 job id 放進 Queue；真正的計算與重試由每批次 PayrollRunAgent DO 執行。
# 第一次部署前先建立：npx wrangler queues create rueisiang-payroll
[[queues.producers]]
binding = "PAYROLL_QUEUE"
queue = "rueisiang-payroll"

[[queues.consumers]]
queue = "rueisiang-payroll"
max_batch_size = 1
max_batch_timeout = 0
max_concurrency = 1
# Cloudflare 會在第一次投遞外再重試 3 次；consumer 以 attempts=4 作為 terminal boundary。
max_retries = 3
dead_letter_queue = "rueisiang-payroll-dlq"

# 每個 LINE chat 與 Sandbox session 對應一個 Pi session DO；OAuth credential 集中在唯一的 vault DO。
# 兩者都使用 Free plan 可用的 SQLite storage backend。
[[durable_objects.bindings]]
name = "ASSISTANT_CHAT_AGENT"
class_name = "AssistantChatAgent"

[[durable_objects.bindings]]
name = "ASSISTANT_CREDENTIAL_VAULT"
class_name = "AssistantCredentialVault"

[[durable_objects.bindings]]
name = "PAYROLL_RUN_AGENT"
class_name = "PayrollRunAgent"

# Sandbox 與 LINE Codex 一律經 Cloudflare Gateway；缺少 VPC binding 時 fail closed。
[[vpc_networks]]
binding = "CODEX_EGRESS"
network_id = "cf1:network"
remote = true

[[durable_objects.bindings]]
name = "REPORT_RUNNER"
class_name = "ReportRunner"

# Shopee 與選用中的 CYBERBIZ 工作共用單一 ReportRunner DO，依序使用可重用的 Container。
[[containers]]
class_name = "ReportRunner"
image = "../../tools/report-runner/Dockerfile"
image_build_context = "../.."
instance_type = "standard-2"
max_instances = 2

[[migrations]]
tag = "v1_pi_agent_sqlite"
new_sqlite_classes = ["AssistantChatAgent", "AssistantCredentialVault"]

[[migrations]]
tag = "v2_payroll_run_agent"
new_sqlite_classes = ["PayrollRunAgent"]

[[migrations]]
tag = "v3_report_runner"
new_sqlite_classes = ["ReportRunner"]

# 正式網域。custom_domain 會由 Cloudflare 自己建立對應的 DNS 記錄——
# 所以不要先手動加一筆，已經有同名記錄的話這裡會掛。
[[routes]]
pattern = "platform.rueisiang.com"
custom_domain = true

# 出金表：執行本身跑在帳務 repo 的 GitHub Actions 上，平台只負責觸發與查狀態。
# CYBERBIZ 帳密、Gmail 與 Drive 的授權都留在那邊的 Actions secrets，這裡碰不到。
# Configure non-secret LINE_LIFF_CHANNEL_ID in the Cloudflare Worker settings when enabling HR LIFF;
# keep_vars = true preserves the dashboard value; keep it out of this file so deploys cannot replace it with a placeholder.
[vars]
PUBLIC_APP_URL = "https://platform.rueisiang.com"
MEDIA_CDN_URL = "https://cdn.rueisiang.com"
AUTH_COOKIE_DOMAIN = ".rueisiang.com"
AUTH_APP_ORIGINS = "https://platform.rueisiang.com,https://hr.rueisiang.com"
PAYOUT_GITHUB_REPO = "ecotech-tw/rueisiang-platform"
PAYOUT_WORKFLOW_FILE = "payout.yml"
PAYOUT_GITHUB_REF = "main"
CYBERBIZ_SALES_WORKFLOW_FILE = "cyberbiz-sales-report.yml"
CYBERBIZ_SALES_GITHUB_REF = "main"
CYBERBIZ_REPORT_RUNNER_MODE = "github"
PI_AGENT_MODEL = "gpt-6-luna"
CYBERBIZ_API_RELAY_URL = "https://cyberbiz-relay.rueisiang.com"
NAS_STORAGE_URL = "https://storage.rueisiang.com"
SHOPEE_SOURCE_BASE_URL = "https://platform.rueisiang.com"
# OAuth Client ID 是公開識別值；client secret 與 refresh token 仍以 Worker secret 儲存。
GOOGLE_REPORTS_OAUTH_CLIENT_ID = "757056407078-6c0nqglhi8gib6ge7bkh7hup3rq1mses.apps.googleusercontent.com"

# 需要的 secret（值不進版控，在 Cloudflare 儀表板或用指令設）：
#   MEDIA_CDN_PURGE_TOKEN      限 rueisiang.com zone 的 Cache Purge 權限
#   MEDIA_CDN_ZONE_ID          rueisiang.com zone ID（可在 Worker vars 設定）
#   AUTH_SESSION_SECRET        簽 session cookie 用，換掉等於所有人登出
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
#   GOOGLE_MAPS_API_KEY        Places API (New) 搜尋與 Maps Static API 地圖背景；需啟用 Billing 與這兩項 API
#   GEMINI_API_KEY              Pi Google provider；Sandbox／LINE 選 Gemini 模型時使用
#   PI_OPENAI_CODEX_CREDENTIAL  舊版 bootstrap 用的 Pi／Codex OAuth credential JSON；匯入 vault 後可移除
#   PI_CREDENTIAL_ENCRYPTION_KEY  至少 32 字元，vault 以 AES-GCM 加密 credential
#   NAS_STORAGE_TOKEN            NAS storage gateway 的獨立 shared secret；必須搭配 NAS_STORAGE_URL
#   LINE_CHANNEL_SECRET         LINE webhook 簽章驗證
#   LINE_CHANNEL_ACCESS_TOKEN   LINE Messaging API Reply／Push 用 token
#   CYBERBIZ_API_TOKEN         客戶與商品 API token
#   CYBERBIZ_API_RELAY_TOKEN   Worker 與 NAS relay 共用的獨立 secret；需搭配 Worker variable CYBERBIZ_API_RELAY_URL
#   CYBERBIZ_WEBHOOK_SECRET    驗 webhook 簽章
#   REPORT_RUNNER_TOKEN                    Worker 與報表 Container 之間的獨立 bearer token
#   GOOGLE_REPORTS_OAUTH_CLIENT_SECRET     報表 OAuth 用戶端密鑰（與平台登入用戶端分開）
#   GOOGLE_REPORTS_DRIVE_REFRESH_TOKEN     報表 Google Drive 帳號授權
#   CYBERBIZ_REPORT_INGEST_TOKEN           共用報表匯入 API；Shopee 與 CYBERBIZ 完整月份寫入 D1 會用到
#   CYBERBIZ_USERNAME                      CYBERBIZ Container runner 登入帳號；僅切換 Container mode 時需要
#   CYBERBIZ_PASSWORD                      CYBERBIZ Container runner 登入密碼；僅切換 Container mode 時需要
#   GOOGLE_REPORTS_GMAIL_REFRESH_TOKEN     CYBERBIZ Container runner 讀取 2FA 郵件用（與 Drive refresh token 分開）
#   GITHUB_TOKEN                           CYBERBIZ fallback runner 的 GitHub Actions 權限；驗證完 Container 前保留
#   UPSTASH_REDIS_REST_URL     商品目錄與營運報表查詢的快取，沿用舊 WMS 的同一個實例
#   UPSTASH_REDIS_REST_TOKEN   （沒設定時改成直接查資料來源，只是比較慢）
#
# 改過 permissions.ts 之後，用權限管理頁的「重新同步」按鈕寫進資料庫，
# 不需要額外的 secret。詳細步驟見 docs/deployment-setup.md。

# 定時補跑處理失敗的 CYBERBIZ webhook 與薪資背景 Queue outbox。取代舊 CRM 那個前端每 15 秒的輪詢——
# 那要有人開著分頁才會動。全量同步不放這裡，它會打很多次官網 API，
# 不該在沒人看著的時候自己跑起來。
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
