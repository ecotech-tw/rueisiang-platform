name = "rueisiang-platform"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true
keep_vars = true

# 靜態檔與 API 同一個 Worker、同一個網域。
# 這組設定沿用出金表工具 worker/wrangler.toml 已驗證可行的做法：
# run_worker_first 讓 /api/* 一定進 Worker，其餘走 Static Assets。
# not_found_handling 讓 React Router 的 client-side 路由重新整理時不會 404。
[assets]
directory = "../portal/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 建立方式：npx wrangler d1 create rueisiang-platform
# 產生的 database_id 貼回這裡（這個值不是機密，可以進版控）。
[[d1_databases]]
binding = "DB"
database_name = "rueisiang-platform"
database_id = "51443700-c187-4ddb-868b-6b88d7ea43f1"
migrations_dir = "../../packages/db/migrations"

# 倉位現場照片。建立方式：npx wrangler r2 bucket create rueisiang-platform-uploads
# 照片本身放這裡，D1 的 zone_images 只存索引（object_key、檔名、大小）。
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "rueisiang-platform-uploads"

# LINE webhook 只把工作寫入 Queue；consumer 優先使用 Reply token，逾時才走每月 200 人的受限 Push。
# 第一次部署前先建立一次：npx wrangler queues create rueisiang-line-assistant
[[queues.producers]]
binding = "LINE_ASSISTANT_QUEUE"
queue = "rueisiang-line-assistant"

[[queues.consumers]]
queue = "rueisiang-line-assistant"
max_batch_size = 1
max_batch_timeout = 0
# max_concurrency 只是降低外部服務壓力；同一個對話的正確順序由 D1 sequence gate 保證，
# 因為 Queue retry 可能讓較早的訊息晚於後續訊息重新投遞。quota 正確性另外由 D1 atomic reservation 保證。
max_concurrency = 1
max_retries = 3
dead_letter_queue = "rueisiang-line-assistant-dlq"

# 每個 LINE chat 與 Sandbox session 對應一個 Pi session DO；OAuth credential 集中在唯一的 vault DO。
# 兩者都使用 Free plan 可用的 SQLite storage backend。
[[durable_objects.bindings]]
name = "ASSISTANT_CHAT_AGENT"
class_name = "AssistantChatAgent"

[[durable_objects.bindings]]
name = "ASSISTANT_CREDENTIAL_VAULT"
class_name = "AssistantCredentialVault"

[[migrations]]
tag = "v1_pi_agent_sqlite"
new_sqlite_classes = ["AssistantChatAgent", "AssistantCredentialVault"]

# 正式網域。custom_domain 會由 Cloudflare 自己建立對應的 DNS 記錄——
# 所以不要先手動加一筆，已經有同名記錄的話這裡會掛。
[[routes]]
pattern = "platform.rueisiang.com"
custom_domain = true

# 出金表：執行本身跑在帳務 repo 的 GitHub Actions 上，平台只負責觸發與查狀態。
# CYBERBIZ 帳密、Gmail 與 Drive 的授權都留在那邊的 Actions secrets，這裡碰不到。
[vars]
PUBLIC_APP_URL = "https://platform.rueisiang.com"
PAYOUT_GITHUB_REPO = "ecotech-tw/rueisiang-platform"
PAYOUT_WORKFLOW_FILE = "payout.yml"
PAYOUT_GITHUB_REF = "main"
CYBERBIZ_SALES_WORKFLOW_FILE = "cyberbiz-sales-report.yml"
CYBERBIZ_SALES_GITHUB_REF = "main"
PI_AGENT_MODEL = "gpt-5.4-mini"
PI_OPENAI_CODEX_RELAY_URL = "https://codex-relay.rueisiang.com"
NAS_STORAGE_URL = "https://storage.rueisiang.com"
SHOPEE_GITHUB_REPO = "ecotech-tw/rueisiang-platform"
SHOPEE_WORKFLOW_FILE = "shopee-sales-report.yml"
SHOPEE_GITHUB_REF = "main"
SHOPEE_SOURCE_BASE_URL = "https://platform.rueisiang.com"

# 需要的 secret（值不進版控，在 Cloudflare 儀表板或用指令設）：
#   AUTH_SESSION_SECRET        簽 session cookie 用，換掉等於所有人登出
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
#   GEMINI_API_KEY              Pi Google provider；Sandbox／LINE 選 Gemini 模型時使用
#   PI_OPENAI_CODEX_CREDENTIAL  Pi／Codex CLI 的 ChatGPT OAuth credential JSON；不是 OPENAI_API_KEY
#   PI_CREDENTIAL_ENCRYPTION_KEY  至少 32 字元，vault 以 AES-GCM 加密 credential
#   PI_OPENAI_CODEX_RELAY_TOKEN  可選；NAS Codex relay 的共享 secret，必須搭配 PI_OPENAI_CODEX_RELAY_URL
#   NAS_STORAGE_TOKEN            NAS storage gateway 的獨立 shared secret；必須搭配 NAS_STORAGE_URL
#   LINE_CHANNEL_SECRET         LINE webhook 簽章驗證
#   LINE_CHANNEL_ACCESS_TOKEN   LINE Messaging API Reply／Push 用 token
#   CYBERBIZ_API_TOKEN         客戶同步
#   CYBERBIZ_WEBHOOK_SECRET    驗 webhook 簽章
#   GITHUB_TOKEN               出金表與蝦皮報表共用的 fine-grained PAT；需涵蓋各自 repo 的 Actions 讀寫，
#                              以及出金表 stores.json 所需的 Contents 寫入
#   UPSTASH_REDIS_REST_URL     商品目錄與營運報表查詢的快取，沿用舊 WMS 的同一個實例
#   UPSTASH_REDIS_REST_TOKEN   （沒設定時改成直接查資料來源，只是比較慢）
#
# 改過 permissions.ts 之後，用權限管理頁的「重新同步」按鈕寫進資料庫，
# 不需要額外的 secret。詳細步驟見 docs/deployment-setup.md。

# 定時補跑處理失敗的 CYBERBIZ webhook。取代舊 CRM 那個前端每 15 秒的輪詢——
# 那要有人開著分頁才會動。全量同步不放這裡，它會打很多次官網 API，
# 不該在沒人看著的時候自己跑起來。
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
