<style>
/* 瑞香品牌色票與基礎字型設定 */
    #rueisiang-store-locator {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      color: #3D241E;
      --rs-primary: #B85D52;
      --rs-primary-dark: #9B4338;
      --rs-primary-light: #C16E63;
      --rs-map-fill: #EBC3BA;
      --rs-map-hover: #E2AFA4;
      --rs-map-active: #DA9B8E;
      --rs-badge-bg: #5B2147;
      --rs-card-bg: #FDFBF9;
    }

    .rs-serif {
      font-family: 'Noto Serif TC', serif;
    }

    /* 台灣縣市多邊形平滑過渡 */
    .rs-county-path {
      fill: #EBC3BA;
      stroke: #FFFFFF;
      stroke-width: 2px;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: fill 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .rs-county-path:hover {
      fill: #E2AFA4;
    }
    .rs-county-path.is-county-active {
      fill: #DFAAA0;
    }

    /* 圖釘外層固定於座標點，內層視覺縮放，避免 hover 造成座標抖動 */
    .rs-pin-anchor {
      cursor: pointer;
      outline: none;
      transition: opacity 0.35s ease;
    }
    .rs-pin-visual {
      transform-origin: 0px 0px;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .rs-pin-anchor:hover .rs-pin-visual,
    .rs-pin-anchor:focus-visible .rs-pin-visual {
      transform: scale(1.22);
    }
    .rs-pin-anchor.is-selected .rs-pin-visual {
      transform: scale(1.32);
    }
    .rs-pin-body {
      transition: fill 0.28s ease;
    }

    /* 選中圖釘脈衝波紋動畫 */
    @keyframes rsPulseRing {
      0% {
        transform: scale(0.65);
        opacity: 0.75;
      }
      100% {
        transform: scale(2.35);
        opacity: 0;
      }
    }
    .rs-pin-pulse {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      opacity: 0;
      pointer-events: none;
    }
    .rs-pin-anchor.is-selected .rs-pin-pulse {
      animation: rsPulseRing 1.9s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    /* 圖釘名稱提示氣泡 */
    .rs-pin-tooltip {
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    .rs-pin-anchor:hover .rs-pin-tooltip,
    .rs-pin-anchor:focus-visible .rs-pin-tooltip,
    .rs-pin-anchor.is-selected .rs-pin-tooltip {
      opacity: 1;
      transform: translateY(0);
    }

    /* 電腦版左側卡片進場動畫 */
    @keyframes rsDesktopCardIn {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .rs-desktop-card-enter {
      animation: rsDesktopCardIn 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 電腦版右側漸層滑動選單（無背景圓弧線） */
    .rs-wheel-shell {
      position: relative;
      height: 368px;
      width: 100%;
    }
    .rs-wheel-viewport {
      position: relative;
      z-index: 2;
      height: 368px;
      overflow-y: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }
    .rs-wheel-viewport.is-dragging {
      cursor: grabbing;
      scroll-behavior: auto;
    }
    .rs-wheel-viewport::-webkit-scrollbar {
      display: none;
    }
    .rs-wheel-item {
      position: relative;
      z-index: 3;
      height: 52px;
      width: 100%;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, color 0.2s ease;
      will-change: transform, opacity;
    }
    .rs-wheel-item:hover .rs-wheel-text {
      color: #B85D52 !important;
    }
    .rs-wheel-item > span {
      pointer-events: none;
    }
    .rs-wheel-text {
      display: inline-block;
      text-align: center !important;
    }

    /* 手機與平板 Modal 動畫 */
    .rs-modal-backdrop {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.32s ease;
    }
    .rs-modal-backdrop.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .rs-modal-panel {
      opacity: 0;
      transform: translateY(18px) scale(0.96);
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .rs-modal-backdrop.is-open .rs-modal-panel {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* 抵抗 Cyberbiz 全域樣式覆蓋的隔離規則 */
    #rueisiang-store-locator,
    #rueisiang-store-locator * {
      box-sizing: border-box;
    }
    #rueisiang-store-locator .rs-pill-tag {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: auto !important;
      height: auto !important;
      min-width: 0 !important;
      max-width: none !important;
      padding-top: 0.2rem !important;
      padding-bottom: 0.2rem !important;
      padding-left: 0.65rem !important;
      padding-right: 0.65rem !important;
      border-radius: 9999px !important;
      line-height: 1.25 !important;
      white-space: nowrap !important;
      flex-shrink: 0 !important;
      letter-spacing: 0.02em !important;
    }
    #rueisiang-store-locator .rs-gmap-btn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 0.4rem !important;
      background-color: #B85D52 !important;
      color: #FFFFFF !important;
      border: 1px solid #B85D52 !important;
      border-radius: 12px !important;
      padding: 10px 16px !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      line-height: 1.3 !important;
      text-decoration: none !important;
      cursor: pointer !important;
      box-shadow: 0 2px 6px rgba(184, 93, 82, 0.22) !important;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease !important;
    }
    #rueisiang-store-locator .rs-gmap-btn:hover {
      background-color: #9B4338 !important;
      border-color: #9B4338 !important;
      color: #FFFFFF !important;
    }
    #rueisiang-store-locator .rs-gmap-btn--full {
      width: 100% !important;
      padding: 12px 18px !important;
      font-size: 14px !important;
    }
    #rueisiang-store-locator .rs-gmap-btn svg,
    #rueisiang-store-locator .rs-gmap-btn span {
      color: #FFFFFF !important;
      stroke: #FFFFFF !important;
      flex-shrink: 0 !important;
    }
    #rueisiang-store-locator .rs-modal-close-circle {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 36px !important;
      height: 36px !important;
      min-width: 36px !important;
      min-height: 36px !important;
      max-width: 36px !important;
      max-height: 36px !important;
      padding: 0 !important;
      border-radius: 9999px !important;
      line-height: 1 !important;
      flex-shrink: 0 !important;
    }
    #rueisiang-store-locator .rs-modal-panel {
      background-color: #FFFFFF !important;
      border-color: #EBC3BA !important;
      border-width: 0 !important;
      box-shadow: 0 24px 48px -12px rgba(62, 39, 35, 0.28) !important;
    }
    #rueisiang-store-locator .rs-modal-panel > div,
    #rueisiang-store-locator .rs-modal-panel > div > div {
      width: 100% !important;
      border: 0 !important;
      outline: 0 !important;
      box-shadow: none !important;
    }
    #rueisiang-store-locator .rs-modal-body-scroll {
      background-color: #FFFFFF !important;
      border: 0 !important;
    }
    #rueisiang-store-locator .rs-modal-footer-bar {
      background-color: #FDFBF9 !important;
      border-top: 1px solid rgba(235, 195, 186, 0.5) !important;
    }
</style>

<script>
(function bootstrapRueiSiangStoreLocator() {
  const STORE_LOCATOR_API = 'https://platform.rueisiang.com/api/public/store-locator';

  async function loadStoresDataFromAPI() {
    const response = await fetch(STORE_LOCATOR_API, { headers: { Accept: 'application/json' } });
    if (!response.ok) throw new Error(`據點資料 API 回應 ${response.status}`);
    const payload = await response.json();
    if (!payload || !Array.isArray(payload.stores)) throw new Error('據點資料格式不正確');
    return payload.stores;
  }

  async function initRueiSiangStoreLocator() {
    let STORES_DATA;
    try {
      STORES_DATA = await loadStoresDataFromAPI();
    } catch (err) {

        desktopCardContainer.innerHTML = buildDesktopEmptyCardHTML();
        return;
      }

      desktopCardContainer.innerHTML = buildDesktopStoreCardHTML(store);
      const closeBtn = document.getElementById('rs-desktop-card-close-btn');
      if (closeBtn) {
        const resetSelection = (e) => {
          e.preventDefault();
          e.stopPropagation();
          activeStoreId = null;
          renderDesktopStoreCard();
          syncMapPinsState();
          highlightCounty(null);

        closeBtn.addEventListener('pointerup', resetSelection);
      }

    function triggerWheelSelection(storeId, idx) {
      const store = STORES_DATA[idx] || STORES_DATA.find(s => s.id === storeId);
      if (!store) return;
      const resolvedIdx = idx >= 0 ? idx : STORES_DATA.findIndex(s => s.id === store.id);

      if (wheelScrollEndTimer) {
        clearTimeout(wheelScrollEndTimer);
        wheelScrollEndTimer = null;
      }
      if (wheelClickLockTimer) {
        clearTimeout(wheelClickLockTimer);
      }
      wheelClickLockTimer = setTimeout(() => {
        wheelClickLockTimer = null;
      }, 500);

      activeStoreId = store.id;
      renderDesktopStoreCard();
      syncMapPinsState();
      highlightCounty(store.county);
      if (mobileSelect && mobileSelect.value !== store.id) {
        mobileSelect.value = store.id;
      }
      if (resolvedIdx >= 0) {
        scrollWheelToIndex(resolvedIdx, true);
      }
      updateWheelCurveStyles();
    }

    function buildDesktopWheelOnce() {
      if (!wheelTrack) return;
      wheelTrack.style.paddingTop = `${WHEEL_PAD_Y}px`;
      wheelTrack.style.paddingBottom = `${WHEEL_PAD_Y}px`;
      wheelTrack.innerHTML = '';

      STORES_DATA.forEach((store, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'rs-wheel-item w-full text-center cursor-pointer focus:outline-none';
        btn.setAttribute('role', 'option');
        btn.setAttribute('data-wheel-index', String(idx));
        btn.setAttribute('data-store-id', store.id);
        btn.innerHTML = `
          <span class="rs-wheel-dot inline-block w-2.5 h-2.5 rounded-full bg-[#B85D52] mr-4 shrink-0 transition-opacity duration-200 opacity-0"></span>
          <span class="rs-wheel-text text-sm leading-snug truncate">${escapeHTML(store.shortName || store.name)}</span>
        `;

        const selectWheelItem = (e) => {
          if (wheelDidDragMove) return;
          e.preventDefault();

          if (typeof btn.focus === 'function') {
            btn.focus({ preventScroll: true });
          }
          triggerWheelSelection(store.id, idx);
        };
        // 實際頁面可能在拖曳或捲動後不派發原生 click；指標操作改由 pointerup 選取。
        btn.addEventListener('pointerup', selectWheelItem);
        btn.addEventListener('click', (e) => {
          if (e.detail !== 0) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }
          e.stopPropagation();
          selectWheelItem(e);
        });

        wheelTrack.appendChild(btn);
      });

      updateWheelCurveStyles();
    }

    function getClosestWheelIndex() {
      if (!wheelViewport) return 0;
      const centerOffset = wheelViewport.scrollTop + WHEEL_VIEWPORT_HEIGHT / 2 - WHEEL_PAD_Y - WHEEL_ITEM_HEIGHT / 2;
      const rawIndex = Math.round(centerOffset / WHEEL_ITEM_HEIGHT);
      return Math.max(0, Math.min(STORES_DATA.length - 1, rawIndex));
    }

    function updateWheelCurveStyles() {
      if (!wheelViewport || !wheelTrack) return;
      const items = wheelTrack.querySelectorAll('.rs-wheel-item');
      const viewportCenterY = wheelViewport.scrollTop + WHEEL_VIEWPORT_HEIGHT / 2;
      const focusedStoreId = activeStoreId || (STORES_DATA[getClosestWheelIndex()] && STORES_DATA[getClosestWheelIndex()].id);

      items.forEach((item, idx) => {
        const itemCenterY = WHEEL_PAD_Y + idx * WHEEL_ITEM_HEIGHT + WHEEL_ITEM_HEIGHT / 2;
        const distSteps = (itemCenterY - viewportCenterY) / WHEEL_ITEM_HEIGHT;
        const absDist = Math.abs(distSteps);

        const textEl = item.querySelector('.rs-wheel-text');
        const dotEl = item.querySelector('.rs-wheel-dot');

        if (absDist > 3.15) {
          item.style.opacity = '0';
          item.style.pointerEvents = 'none';
          item.style.transform = `translateX(${(Math.min(absDist, 4) * 8).toFixed(1)}px) scale(0.84)`;
          return;
        }

        item.style.pointerEvents = 'auto';
        const normalized = Math.min(absDist / 3.15, 1);
        const arcShiftX = Math.pow(absDist, 1.35) * 10;
        const scaleVal = 1 - normalized * 0.14;
        const opacityVal = Math.max(0.08, 1 - Math.pow(normalized, 1.25) * 0.92);

        item.style.opacity = opacityVal.toFixed(3);
        item.style.transform = `translateX(${arcShiftX.toFixed(1)}px) scale(${scaleVal.toFixed(3)})`;

        const isSelected = item.getAttribute('data-store-id') === activeStoreId;
        const isFocused = (isSelected && absDist < 2.2) || (!activeStoreId && item.getAttribute('data-store-id') === focusedStoreId && absDist < 1.35);
        if (textEl) {
          if (isFocused) {
            textEl.style.color = '#24120E';
            textEl.style.fontWeight = '700';
            textEl.style.fontSize = '15.5px';
          } else {
            const lightFactor = Math.min(absDist / 2.8, 1);
            const r = Math.round(92 + lightFactor * 96);
            const g = Math.round(64 + lightFactor * 104);
            const b = Math.round(55 + lightFactor * 107);
            textEl.style.color = `rgb(${r}, ${g}, ${b})`;
            textEl.style.fontWeight = absDist < 1.2 ? '600' : '400';
            textEl.style.fontSize = '13.5px';
          }
        }
        if (dotEl) {
          dotEl.style.opacity = isFocused ? '1' : '0';
        }
        item.setAttribute('aria-selected', String(isFocused));
      });
    }

    function scrollWheelToIndex(index, smooth = true) {
      if (!wheelViewport || index < 0 || index >= STORES_DATA.length) return;
      const targetScrollTop = WHEEL_PAD_Y + index * WHEEL_ITEM_HEIGHT + WHEEL_ITEM_HEIGHT / 2 - WHEEL_VIEWPORT_HEIGHT / 2;
      isProgrammaticWheelScroll = true;
      if (wheelProgrammaticTimer) {
        clearTimeout(wheelProgrammaticTimer);
      }
      wheelViewport.scrollTo({
        top: Math.max(0, targetScrollTop),
        behavior: smooth ? 'smooth' : 'auto'
      });
      wheelProgrammaticTimer = setTimeout(() => {
        isProgrammaticWheelScroll = false;
        updateWheelCurveStyles();
      }, smooth ? 460 : 50);
    }

    function syncWheelToStoreId(storeId, smooth = true) {
      if (!storeId) return;
      const idx = STORES_DATA.findIndex(s => s.id === storeId);
      if (idx !== -1) {
        scrollWheelToIndex(idx, smooth);
      }
    }

    function scheduleWheelSnapAndSelect() {
      if (wheelClickLockTimer) return;
      if (wheelScrollEndTimer) {
        clearTimeout(wheelScrollEndTimer);
      }
      wheelScrollEndTimer = setTimeout(() => {
        const closestIdx = getClosestWheelIndex();
        const targetStore = STORES_DATA[closestIdx];
        scrollWheelToIndex(closestIdx, true);
        if (targetStore) {
          selectStore(targetStore.id, { toggleIfSame: false, openModalOnMobile: false, syncWheel: false });
        }
      }, 120);
    }

    if (wheelViewport) {
      wheelViewport.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        isPointerDraggingWheel = true;
        wheelDidDragMove = false;
        wheelDragStartY = e.clientY;
        wheelDragStartScrollTop = wheelViewport.scrollTop;
        if (wheelScrollEndTimer) {
          clearTimeout(wheelScrollEndTimer);
          wheelScrollEndTimer = null;
        }
        wheelViewport.classList.add('is-dragging');
      });

      window.addEventListener('pointermove', (e) => {
        if (!isPointerDraggingWheel || !wheelViewport) return;
        const deltaY = e.clientY - wheelDragStartY;
        if (Math.abs(deltaY) > 8) {
          wheelDidDragMove = true;
          if (wheelClickLockTimer) {
            clearTimeout(wheelClickLockTimer);
            wheelClickLockTimer = null;
          }
        }
        if (wheelDidDragMove) {
          wheelViewport.scrollTop = wheelDragStartScrollTop - deltaY;
        }
        updateWheelCurveStyles();
      }, { passive: true });

      const finishWheelDrag = () => {
        if (!isPointerDraggingWheel) return;
        isPointerDraggingWheel = false;
        if (wheelViewport) {
          wheelViewport.classList.remove('is-dragging');
        }
        if (wheelDidDragMove) {
          scheduleWheelSnapAndSelect();
          setTimeout(() => {
            wheelDidDragMove = false;
          }, 60);
        }
      };

      window.addEventListener('pointerup', finishWheelDrag);
      window.addEventListener('pointercancel', finishWheelDrag);

      wheelViewport.addEventListener('scroll', () => {
        updateWheelCurveStyles();
        if (isProgrammaticWheelScroll || isPointerDraggingWheel || wheelClickLockTimer) return;
        scheduleWheelSnapAndSelect();
      }, { passive: true });
    }

        anchor.setAttribute('data-pin-region', store.region);
        anchor.setAttribute('transform', `translate(${store.pinX}, ${store.pinY})`);
        anchor.setAttribute('role', 'button');
        anchor.setAttribute('tabindex', '0');
        anchor.setAttribute('aria-label', `${store.label} - 點擊查看詳情`);

        const zoomComp = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        zoomComp.setAttribute('class', 'rs-pin-zoom-comp');

        const hitCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hitCircle.setAttribute('cx', '0');
        hitCircle.setAttribute('cy', '-15');
        hitCircle.setAttribute('r', '20');
        hitCircle.setAttribute('fill', 'transparent');

        const pulseCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        pulseCircle.setAttribute('class', 'rs-pin-pulse');
        pulseCircle.setAttribute('cx', '0');
        pulseCircle.setAttribute('cy', '-23');
        pulseCircle.setAttribute('r', '14');
        pulseCircle.setAttribute('fill', '#B85D52');

        const visual = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        visual.setAttribute('class', 'rs-pin-visual');
        visual.setAttribute('filter', 'url(#rsPinShadow)');
        visual.innerHTML = `
          <path class="rs-pin-body" d="M 0,0 C -8.5,-10.5 -12.5,-16.5 -12.5,-23 A 12.5,12.5 0 1,1 12.5,-23 C 12.5,-16.5 8.5,-10.5 0,0 Z"
                fill="#B85D52"
                stroke="#FFFFFF"
                stroke-width="1.6" />
          <circle cx="0" cy="-23" r="5" fill="#F6DFDA" />
        `;

        const labelText = store.shortName || store.name;
        const pillWidth = Math.max(66, labelText.length * 10.5 + 16);
        const tooltipGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        tooltipGroup.setAttribute('class', 'rs-pin-tooltip');
        tooltipGroup.setAttribute('data-pin-tooltip', 'true');
        tooltipGroup.setAttribute('transform', 'translate(0, -42)');
        tooltipGroup.innerHTML = `
          <rect x="${(-pillWidth / 2).toFixed(1)}" y="-17" width="${pillWidth.toFixed(1)}" height="21" rx="10.5"
                fill="#3D241E" stroke="#FFFFFF" stroke-width="1.2" opacity="0.94" />
          <polygon points="-4,4 4,4 0,8" fill="#3D241E" />
          <text x="0" y="-3.5" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="600" letter-spacing="0.3">
            ${escapeHTML(labelText)}
          </text>
        `;

        const titleEl = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        titleEl.textContent = store.label;

        zoomComp.appendChild(pulseCircle);
        zoomComp.appendChild(visual);
        zoomComp.appendChild(tooltipGroup);
        zoomComp.appendChild(hitCircle);

        anchor.appendChild(zoomComp);
        anchor.appendChild(titleEl);

        anchor.addEventListener('click', (e) => {
          e.stopPropagation();
          selectStore(store.id, { toggleIfSame: false, openModalOnMobile: true, syncWheel: true });
        });

        anchor.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectStore(store.id, { toggleIfSame: false, openModalOnMobile: true, syncWheel: true });
          }
        });

        pinsLayer.appendChild(anchor);
      });
    }

    function syncMapPinsState() {
      if (!pinsLayer) return;
      const anchors = pinsLayer.querySelectorAll('.rs-pin-anchor');
      anchors.forEach(anchor => {
        const pinId = anchor.getAttribute('data-pin-id');
        const pinBody = anchor.querySelector('.rs-pin-body');
        const tooltipEl = anchor.querySelector('[data-pin-tooltip="true"]');
        const isSelected = pinId === activeStoreId;

        anchor.classList.toggle('is-selected', isSelected);
        if (tooltipEl) {
          tooltipEl.style.opacity = isSelected ? '1' : '0';
          tooltipEl.style.transform = isSelected ? 'translateY(0px)' : 'translateY(4px)';
        }
        if (pinBody) {
          pinBody.setAttribute('fill', isSelected ? '#9B3B30' : '#B85D52');
        }
        if (isSelected && anchor.parentNode === pinsLayer) {
          pinsLayer.appendChild(anchor);
        }
      });
    }

    function highlightCounty(countyName) {
      countyPaths.forEach(path => {
        path.classList.toggle('is-county-active', Boolean(countyName) && path.dataset.county === countyName);
      });
    }

    function selectStore(storeId, options = { toggleIfSame: false, openModalOnMobile: true, syncWheel: true }) {
      const store = STORES_DATA.find(s => s.id === storeId);
      if (!store) return;

      if (mobileSelect && mobileSelect.value !== store.id) {
        mobileSelect.value = store.id;
      }

      if (isMobileOrTablet()) {
        activeStoreId = storeId;
        syncMapPinsState();
        highlightCounty(store.county);
        if (options.openModalOnMobile) {
          openMobileModal(store);
        }
        return;
      }

      if (options.toggleIfSame && activeStoreId === storeId) {
        activeStoreId = null;
        renderDesktopStoreCard();
        syncMapPinsState();
        highlightCounty(null);
        updateWheelCurveStyles();
        return;
      }

      activeStoreId = storeId;
      renderDesktopStoreCard();
      syncMapPinsState();
      highlightCounty(store.county);
      if (options.syncWheel !== false) {
        syncWheelToStoreId(storeId, false);
      }
      updateWheelCurveStyles();
    }

    function openMobileModal(store) {
      modalBody.innerHTML = buildMobileModalHTML(store);
      requestAnimationFrame(() => {
        modalBackdrop.classList.add('is-open');
      });
      document.body.style.overflow = 'hidden';
    }

    function closeMobileModal() {
      modalBackdrop.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    function syncResponsiveMapPlacement() {
      if (!mapSvg || !desktopMapHost || !mobileMapHost) return;
      if (isMobileOrTablet()) {
        mapSvg.classList.remove('max-w-[540px]');
        mapSvg.classList.add('max-w-none', 'h-full', 'w-auto');
        if (mapSvg.parentNode !== mobileMapHost) {
          mobileMapHost.appendChild(mapSvg);
        }
      } else {
        mapSvg.classList.remove('max-w-none', 'h-full', 'w-auto');
        mapSvg.classList.add('w-full', 'h-full', 'max-w-[540px]');
        if (mapSvg.parentNode !== desktopMapHost) {
          desktopMapHost.appendChild(mapSvg);
        }
      }
    }

    window.addEventListener('resize', () => {
      syncResponsiveMapPlacement();
      updateWheelCurveStyles();
    });

    if (modalBackdrop) {
      modalBackdrop.addEventListener('click', (e) => {
        if (e.target === modalBackdrop) {
          closeMobileModal();
        }
      });
    }
    if (modalCloseBtn) {
      modalCloseBtn.addEventListener('click', closeMobileModal);
    }
    if (modalBottomClose) {
      modalBottomClose.addEventListener('click', closeMobileModal);
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalBackdrop && modalBackdrop.classList.contains('is-open')) {
        closeMobileModal();
      }
    });

    if (mapSvg) {
      mapSvg.setAttribute('viewBox', DEFAULT_VIEW_BOX.join(' '));
    }
    syncResponsiveMapPlacement();
    buildMapPinsOnce();
    buildDesktopWheelOnce();
    buildMobileSelectOptions();
    renderDesktopStoreCard();
    syncMapPinsState();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initRueiSiangStoreLocator, { once: true });
  } else {
    initRueiSiangStoreLocator();
  }
})();
</script>
