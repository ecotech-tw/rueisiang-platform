name: CI

# 每次推送與 PR 都跑。這個 workflow 不需要任何 secret，
# 所以在 Cloudflare 還沒開通之前就能用。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # HR is a separate static Worker; its production bundle must call the Platform API.
      VITE_API_BASE_URL: ${{ vars.HR_API_BASE_URL || 'https://platform.rueisiang.com/api' }}
    steps:
      - uses: actions/checkout@v7

      - name: 驗證 GitHub Actions workflows
        uses: raven-actions/actionlint@v2
        with:
          version: 1.7.12
          shellcheck: false
          pyflakes: false

      - name: 測試 Deploy 變更範圍
        run: bash .github/scripts/test-deploy-scope.sh

      # 版本從 package.json 的 packageManager 欄位讀，不在這裡再寫一次。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 測試用 node:sqlite 當 D1 的替身，需要 Node 24 才是內建可用。
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # 不跑 pnpm build：三個 app 的 build 都會先再跑一次 tsc --noEmit，而上面的
      # typecheck 已經檢查過同一份原始碼。這裡只產 Deploy 要取用的兩份 dist。
      - name: 打包 portal 與 HR
        run: pnpm --filter @rueisiang/portal --filter @rueisiang/hr exec vite build

      # main 的 CI 成功後由 Deploy workflow 直接取用這些產物，不再重跑整套驗證。
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: deploy-portal-dist
          path: apps/portal/dist
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: deploy-hr-dist
          path: apps/hr/dist
          if-no-files-found: error
          overwrite: true

      # CYBERBIZ 報表工具刻意留在 pnpm workspace 之外（pnpm-workspace.yaml 只 glob
      # apps/* 與 packages/*）：它是純 JS、用 npm 自己的 lockfile，而且相依
      # Playwright。拉進 workspace 會讓每個開發者的 pnpm install 都扛一份
      # 只有 GitHub Actions 用得到的瀏覽器函式庫。
      - name: CYBERBIZ 報表工具的自我檢查
        working-directory: tools/cyberbiz-reports
        run: |
          npm ci
          node selftest.mjs

      - name: 蝦皮銷售報表工具的自我檢查
        working-directory: tools/shopee-sales-report-export
        run: |
          npm ci
          node selftest.mjs

      # 開發機是 Windows on ARM，起不了 workerd，所以「設定檔到底能不能部署」
      # 這件事只有在 Linux 上才驗得到。放在最後：前面都過了才有意義。
      - name: 驗證 API Worker 設定與打包
        working-directory: apps/api
        run: |
          pnpm rebuild workerd
          npx wrangler deploy --dry-run

      - name: 驗證 HR Worker 設定與打包
        working-directory: apps/hr
        run: pnpm dry-run
