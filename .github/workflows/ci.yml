name: CI

# 每次推送與 PR 都跑。這個 workflow 不需要任何 secret，
# 所以在 Cloudflare 還沒開通之前就能用。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本從 package.json 的 packageManager 欄位讀，不在這裡再寫一次。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 測試用 node:sqlite 當 D1 的替身，需要 Node 24 才是內建可用。
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Knip 的 baseline 觀察。本機是 Windows on ARM，native binding 被
      # Application Control 擋住跑不起來，所以只有這裡看得到真實結果。
      # 現階段純報告：--no-exit-code 讓既有的死碼與依賴問題不擋 merge，
      # continue-on-error 再擋一層，避免 Knip 自己爆掉時弄壞 CI。
      # 先看數字有多少、多少是誤報，再決定要不要正式安裝設定檔並升成 gate。
      - name: Knip baseline（只回報，不阻擋）
        continue-on-error: true
        run: pnpm dlx knip --no-exit-code --no-progress --reporter github-actions

      # CYBERBIZ 報表工具刻意留在 pnpm workspace 之外（pnpm-workspace.yaml 只 glob
      # apps/* 與 packages/*）：它是純 JS、用 npm 自己的 lockfile，而且相依
      # Playwright。拉進 workspace 會讓每個開發者的 pnpm install 都扛一份
      # 只有 GitHub Actions 用得到的瀏覽器函式庫。
      - name: CYBERBIZ 報表工具的自我檢查
        working-directory: tools/cyberbiz-reports
        run: |
          npm ci
          node selftest.mjs

      - name: 蝦皮銷售報表工具的自我檢查
        working-directory: tools/shopee-sales-report-export
        run: |
          npm ci
          node selftest.mjs

      # 開發機是 Windows on ARM，起不了 workerd，所以「設定檔到底能不能部署」
      # 這件事只有在 Linux 上才驗得到。放在最後：前面都過了才有意義。
      - name: 驗證 Worker 設定與打包
        working-directory: apps/api
        run: |
          pnpm rebuild workerd
          npx wrangler deploy --dry-run
