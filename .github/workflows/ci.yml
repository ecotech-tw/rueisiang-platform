name: CI

# 每次推送與 PR 都跑。這個 workflow 不需要任何 secret，
# 所以在 Cloudflare 還沒開通之前就能用。
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本從 package.json 的 packageManager 欄位讀，不在這裡再寫一次。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # 測試用 node:sqlite 當 D1 的替身，需要 Node 24 才是內建可用。
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # 出金表工具刻意留在 pnpm workspace 之外（pnpm-workspace.yaml 只 glob
      # apps/* 與 packages/*）：它是純 JS、用 npm 自己的 lockfile，而且相依
      # Playwright。拉進 workspace 會讓每個開發者的 pnpm install 都扛一份
      # 只有 GitHub Actions 用得到的瀏覽器函式庫。
      - name: 出金表工具的自我檢查
        working-directory: tools/cyberbiz-monthly-payout
        run: |
          npm ci
          node selftest.mjs

      # 開發機是 Windows on ARM，起不了 workerd，所以「設定檔到底能不能部署」
      # 這件事只有在 Linux 上才驗得到。放在最後：前面都過了才有意義。
      - name: 驗證 Worker 設定與打包
        working-directory: apps/api
        run: |
          pnpm rebuild workerd
          npx wrangler deploy --dry-run

  codex-tcp-smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Probe chatgpt.com through Workers TCP Sockets
        run: |
          set -euo pipefail
          pnpm --filter @rueisiang/api exec wrangler dev \
            --remote \
            --config ../../tools/codex-tcp-smoke/wrangler.toml \
            --port 8789 > smoke.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8789/probe > probe.json; then
              break
            fi
            sleep 2
          done

          test -s probe.json || {
            cat smoke.log
            exit 1
          }
          cat probe.json
          echo
          cat smoke.log
