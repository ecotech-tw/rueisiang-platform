name: Deploy

# 目前只能手動觸發（Actions 分頁 → Deploy → Run workflow）。
#
# 等第一次上線順利、secret 都設好之後，把下面這段加進 on: 就會變成
# 推上 main 自動部署：
#
#   push:
#     branches: [main]
on:
  workflow_dispatch:

# 同時只跑一個部署。兩個部署交錯執行會讓 migration 的順序變得沒辦法推理。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm-workspace.yaml 把 workerd 的安裝腳本關掉了（開發機是 Windows on ARM，
      # 開著會讓整個 install 失敗）。Linux 上沒這個問題，這裡單獨補跑。
      - name: 補上 workerd 執行檔
        run: pnpm rebuild workerd

      # 部署前再驗一次。CI 已經跑過，但手動觸發可能挑的是還沒跑過 CI 的 commit。
      - run: pnpm typecheck
      - run: pnpm test

      # portal 的產物要先出來——wrangler.toml 的 [assets] 指向 ../portal/dist。
      - run: pnpm build

      # schema 先於程式碼：新欄位要在讀它的程式上線之前就存在。
      - name: 套用 D1 migration
        working-directory: apps/api
        run: npx wrangler d1 migrations apply rueisiang-platform --remote

      # 網址從部署輸出裡讀，不要求人另外維護一個變數：手寫的變數會忘記加
      # https://、會在綁自訂網域之後過期，而部署輸出永遠是當下的事實。
      - name: 部署 Worker
        id: deploy
        working-directory: apps/api
        run: |
          set -o pipefail
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+' deploy.log \
            | grep -vE 'github\.com|cloudflare\.com' \
            | head -1)
          if [ -z "$url" ]; then
            echo "::error::部署輸出裡找不到網址，無法做健康檢查。"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::已部署到 $url"

      # 煙霧測試：確認 Worker 活著，而且 D1 綁定真的接上了。
      # 新部署的 Worker 要幾秒才會在所有節點生效，所以帶重試。
      - name: 確認部署結果
        run: |
          response=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            "${{ steps.deploy.outputs.url }}/api/health")
          echo "$response"
          echo "$response" | grep -q '"database":"ok"' || {
            echo "::error::健康檢查沒過：D1 綁定可能沒接上。"
            exit 1
          }
