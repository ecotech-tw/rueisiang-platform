name: Deploy

# main 的 CI 成功後自動部署，另外保留手動觸發（要重跑或回滾時用）。
#
# CI 已經建立並驗證同一個 commit 的前端產物；Deploy 只下載產物、套 migration、部署
# 與做 smoke test，避免同一個 commit 在 CI 與 Deploy 重跑 typecheck／test／build。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# 同時只跑一個部署。兩個部署交錯執行會讓 migration 的順序變得沒辦法推理。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  detect:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.paths.outputs.platform }}
      migrations: ${{ steps.paths.outputs.migrations }}
      hr: ${{ steps.paths.outputs.hr }}
      current: ${{ steps.current.outputs.current }}
      attempt: ${{ steps.current.outputs.attempt }}
      artifact_run_id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 確認 CI 對應的 commit 仍在 main
        id: current
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          echo "attempt=$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$latest_sha" == "$TARGET_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "跳過過期的部署：$TARGET_SHA 已不是 main 最新 commit（目前是 $latest_sha）。"
          fi
      # concurrency 可能跳過中間 Deploy，不能只看這次 CI push 的 diff。
      - name: 計算上次成功部署後的累積變更
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_RUN: ${{ steps.current.outputs.current }}
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_RUN" != "true" ]]; then
            changed="過期的 workflow_run"
            {
              echo "platform=false"
              echo "migrations=false"
              echo "hr=false"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed="manual trigger"
            {
              echo "platform=true"
              echo "migrations=true"
              echo "hr=true"
            } >> "$GITHUB_OUTPUT"
          else
            last_deployed_sha="$(node "$GITHUB_WORKSPACE/.github/scripts/deploy-baseline.mjs")"

            if [[ -n "$last_deployed_sha" ]] \
              && git cat-file -e "$last_deployed_sha^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$last_deployed_sha" "$TARGET_SHA"; then
              changed="$(git diff --name-only "$last_deployed_sha" "$TARGET_SHA")"
              echo "累積變更基準：$last_deployed_sha"
            else
              changed="$(git ls-tree -r --name-only "$TARGET_SHA")"
              echo "找不到可用的上次成功 Deploy 基準，使用完整 tree。"
            fi
            bash "$GITHUB_WORKSPACE/.github/scripts/detect-deploy-scope.sh" "$GITHUB_OUTPUT" <<< "$changed"
          fi
          echo "變更檔案："
          printf '%s\n' "$changed"

  prepare:
    needs: detect
    if: needs.detect.outputs.current == 'true' && needs.detect.outputs.attempt == format('{0}', github.run_attempt) && (needs.detect.outputs.platform == 'true' || needs.detect.outputs.migrations == 'true' || needs.detect.outputs.hr == 'true')
    runs-on: ubuntu-latest
    env:
      # HR is a separate static Worker; its production bundle must call the Platform API.
      VITE_API_BASE_URL: ${{ vars.HR_API_BASE_URL || 'https://platform.rueisiang.com/api' }}
      VITE_LIFF_ID: ${{ vars.HR_LIFF_ID || '' }}
    steps:
      - name: 使用 main CI 的已驗證產物
        if: github.event_name == 'workflow_run'
        run: echo "artifact run ${{ needs.detect.outputs.artifact_run_id }}"
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event_name == 'workflow_dispatch'
      # 手動重跑／回滾沒有先前的 CI 產物，所以仍然完整驗證。
      - name: 補上 workerd 執行檔
        if: github.event_name == 'workflow_dispatch'
        run: pnpm rebuild workerd
      - run: pnpm typecheck
        if: github.event_name == 'workflow_dispatch'
      - run: pnpm test
        if: github.event_name == 'workflow_dispatch'
      # 與 ci.yml 同一條指令：typecheck 已經檢查過，這裡只產兩份 dist。
      - name: 打包 portal 與 HR
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @rueisiang/portal --filter @rueisiang/hr exec vite build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: deploy-portal-dist
          path: apps/portal/dist
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: deploy-hr-dist
          path: apps/hr/dist
          if-no-files-found: error
          overwrite: true

  deploy-platform:
    needs: [detect, prepare]
    if: needs.detect.outputs.current == 'true' && needs.detect.outputs.attempt == format('{0}', github.run_attempt) && (needs.detect.outputs.platform == 'true' || needs.detect.outputs.migrations == 'true')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm-workspace.yaml 把 workerd 的安裝腳本關掉了（開發機是 Windows on ARM，
      # 開著會讓整個 install 失敗）。Linux 上沒這個問題，這裡單獨補跑。
      - name: 補上 workerd 執行檔
        run: pnpm rebuild workerd

      # 從同一個 CI run（或手動驗證的本次 run）取回已驗證的前端產物。
      - uses: actions/download-artifact@v4
        if: needs.detect.outputs.platform == 'true'
        with:
          name: deploy-portal-dist
          path: apps/portal/dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.detect.outputs.artifact_run_id }}

      # 只有 migration 路徑變更才碰 D1。0135/0136 等一般 migration 可安全在同一批套用；
      # 既有 cutover 流程仍刻意排除 0114，確保 legacy 表在新 Worker 接手前不會被刪除。
      - name: 套用 cutover 前 D1 migration（保留 legacy table）
        if: needs.detect.outputs.migrations == 'true'
        working-directory: apps/api
        run: |
          set -euo pipefail
          pre_dir="$GITHUB_WORKSPACE/.deploy-migrations/pre-cutover"
          rm -rf "$pre_dir"
          mkdir -p "$pre_dir"
          cp "$GITHUB_WORKSPACE"/packages/db/migrations/*.sql "$pre_dir"/
          rm "$pre_dir/0114_absent_king_cobra.sql"
          sed 's#^[[:space:]]*migrations_dir = .*#migrations_dir = "../../.deploy-migrations/pre-cutover"#' \
            wrangler.toml > wrangler.predeploy.toml
          npx wrangler d1 migrations apply rueisiang-platform --config wrangler.predeploy.toml --remote

      # 網址從部署輸出裡讀，不要求人另外維護一個變數：手寫的變數會忘記加
      # https://、會在綁自訂網域之後過期，而部署輸出永遠是當下的事實。
      - name: 部署 Worker
        if: needs.detect.outputs.platform == 'true'
        id: deploy
        working-directory: apps/api
        run: |
          set -o pipefail
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[^[:space:]]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::部署輸出裡找不到 workers.dev 網址，無法做健康檢查。"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::已部署到 $url"

      # 新 Worker 已接手後才刪 legacy table。若這一步失敗，舊表仍在，部署可安全重跑。
      - name: 套用 cutover 後 D1 migration（移除 legacy table）
        if: needs.detect.outputs.migrations == 'true'
        working-directory: apps/api
        run: npx wrangler d1 migrations apply rueisiang-platform --remote

      # 先驗證 workers.dev，再驗證自訂網域；新部署的 Worker 要幾秒才會在所有節點生效。
      - name: 確認 Platform workers.dev
        if: needs.detect.outputs.platform == 'true'
        run: |
          response=$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            "${{ steps.deploy.outputs.url }}/api/health")
          echo "$response"
          echo "$response" | grep -q '"database":"ok"' || {
            echo "::error::workers.dev 健康檢查沒過：D1 綁定可能沒接上。"
            exit 1
          }
      - name: 等待 Platform 自訂網域
        if: needs.detect.outputs.platform == 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if response=$(curl -fsS --max-time 10 https://platform.rueisiang.com/api/health); then
              echo "$response"
              echo "$response" | grep -q '"database":"ok"' && exit 0
            fi
            echo "等待 platform.rueisiang.com（第 $attempt/20 次）"
            sleep 3
          done
          echo "::error::Platform 自訂網域健康檢查逾時。"
          exit 1

  deploy-hr:
    needs: [detect, prepare]
    if: needs.detect.outputs.current == 'true' && needs.detect.outputs.attempt == format('{0}', github.run_attempt) && needs.detect.outputs.hr == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: deploy-hr-dist
          path: apps/hr/dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.detect.outputs.artifact_run_id }}

      - name: 部署 HR 靜態 Worker
        id: deploy_hr
        working-directory: apps/hr
        run: |
          set -o pipefail
          pnpm deploy | tee deploy.log
          url=$(grep -oE 'https://[^[:space:]]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::部署輸出裡找不到 HR workers.dev 網址，無法做健康檢查。"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::已部署 HR 到 $url"

      # 先驗證 workers.dev，再等待自訂網域 DNS／憑證與 Worker rollout 完成。
      - name: 確認 HR workers.dev
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${{ steps.deploy_hr.outputs.url }}/" | grep -q '<div id="root">'
      - name: 等待 HR 自訂網域
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 https://hr.rueisiang.com/ | grep -q '<div id="root">'; then
              exit 0
            fi
            echo "等待 hr.rueisiang.com（第 $attempt/20 次）"
            sleep 3
          done
          echo "::error::HR 自訂網域健康檢查逾時。"
          exit 1

  record-deployment:
    needs: [detect, prepare, deploy-platform, deploy-hr]
    if: always() && !cancelled() && needs.detect.outputs.current == 'true' && needs.detect.outputs.attempt == format('{0}', github.run_attempt) && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 確認部署與 smoke test 全部成功
        id: marker
        env:
          CURRENT_RUN: ${{ needs.detect.outputs.current }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PLATFORM_RESULT: ${{ needs.deploy-platform.result }}
          HR_RESULT: ${{ needs.deploy-hr.result }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: node .github/scripts/deploy-baseline.mjs record
      # 未部署、部分成功或 smoke test 失敗都不能變成累積 diff 的基準。
      - uses: actions/upload-artifact@v4
        if: steps.marker.outputs.sha != ''
        with:
          name: deployed-commit-${{ steps.marker.outputs.sha }}-attempt-${{ github.run_attempt }}
          path: deployment-commit.txt
          if-no-files-found: error
          overwrite: true
