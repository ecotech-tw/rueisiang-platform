name: Deploy

# 推上 main 就自動部署，另外保留手動觸發（要重跑或回滾時用）。
#
# 之所以敢這樣掛：能進 main 的東西都得先過 PR 的 CI——型別檢查、測試、build，
# 外加在 Linux 上跑一次 wrangler deploy --dry-run。這裡再跑一次是因為手動觸發
# 可能挑到還沒跑過 CI 的 commit。
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# 同時只跑一個部署。兩個部署交錯執行會讓 migration 的順序變得沒辦法推理。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm-workspace.yaml 把 workerd 的安裝腳本關掉了（開發機是 Windows on ARM，
      # 開著會讓整個 install 失敗）。Linux 上沒這個問題，這裡單獨補跑。
      - name: 補上 workerd 執行檔
        run: pnpm rebuild workerd

      # 部署前再驗一次。CI 已經跑過，但手動觸發可能挑的是還沒跑過 CI 的 commit。
      - run: pnpm typecheck
      - run: pnpm test

      # portal 的產物要先出來——wrangler.toml 的 [assets] 指向 ../portal/dist。
      - run: pnpm build

      # 0112/0113/0115 先上，但刻意排除 0114：0114 會 DROP 舊 webhook/link 表，
      # 必須等新 Worker 已經接手流量後才能執行。D1 migrations apply 沒有「做到某一支」
      # 的參數，所以用同一份 wrangler 設定指向一個移除 0114 的暫存目錄；正式 migration
      # history 仍由 D1 的 d1_migrations 記錄，下一步會只補套 0114。
      - name: 套用 cutover 前 D1 migration（保留 legacy table）
        working-directory: apps/api
        run: |
          set -euo pipefail
          pre_dir="$GITHUB_WORKSPACE/.deploy-migrations/pre-cutover"
          rm -rf "$pre_dir"
          mkdir -p "$pre_dir"
          cp "$GITHUB_WORKSPACE"/packages/db/migrations/*.sql "$pre_dir"/
          rm "$pre_dir/0114_absent_king_cobra.sql"
          sed 's#^[[:space:]]*migrations_dir = .*#migrations_dir = "../../.deploy-migrations/pre-cutover"#' \
            wrangler.toml > wrangler.predeploy.toml
          npx wrangler d1 migrations apply rueisiang-platform --config wrangler.predeploy.toml --remote

      # 網址從部署輸出裡讀，不要求人另外維護一個變數：手寫的變數會忘記加
      # https://、會在綁自訂網域之後過期，而部署輸出永遠是當下的事實。
      - name: 部署 Worker
        id: deploy
        working-directory: apps/api
        run: |
          set -o pipefail
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+' deploy.log \
            | grep -vE 'github\.com|cloudflare\.com' \
            | head -1)
          if [ -z "$url" ]; then
            echo "::error::部署輸出裡找不到網址，無法做健康檢查。"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::已部署到 $url"

      # 新 Worker 已接手後才刪 legacy table。若這一步失敗，舊表仍在，部署可安全重跑。
      - name: 套用 cutover 後 D1 migration（移除 legacy table）
        working-directory: apps/api
        run: npx wrangler d1 migrations apply rueisiang-platform --remote

      # 煙霧測試：確認 Worker 活著，而且 D1 綁定真的接上了。
      # 新部署的 Worker 要幾秒才會在所有節點生效，所以帶重試。
      - name: 確認部署結果
        run: |
          response=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            "${{ steps.deploy.outputs.url }}/api/health")
          echo "$response"
          echo "$response" | grep -q '"database":"ok"' || {
            echo "::error::健康檢查沒過：D1 綁定可能沒接上。"
            exit 1
          }
