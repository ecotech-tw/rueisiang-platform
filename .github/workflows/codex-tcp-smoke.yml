name: Codex TCP socket smoke test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Probe chatgpt.com through Workers TCP Sockets
        run: |
          set -euo pipefail
          pnpm --filter @rueisiang/api exec wrangler dev \
            --remote \
            --config tools/codex-tcp-smoke/wrangler.toml \
            --port 8789 > smoke.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8789/probe > probe.json; then
              break
            fi
            sleep 2
          done

          test -s probe.json || {
            cat smoke.log
            exit 1
          }
          cat probe.json
          echo
          cat smoke.log
