name: CYBERBIZ 商品銷售報表
run-name: 商品銷售報表｜${{ inputs.store }}｜${{ inputs.start }} ~ ${{ inputs.end }}｜${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      store:
        description: 要執行的通路（全部或單一店名）
        type: string
        default: 全部
      start:
        description: 起日 YYYY-MM-DD
        type: string
        required: true
      end:
        description: 迄日 YYYY-MM-DD
        type: string
        required: true
      request_id:
        description: 網頁執行識別碼
        type: string
        required: true

concurrency:
  group: cyberbiz-reports
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/cyberbiz-monthly-payout
    env:
      TZ: Asia/Taipei
      CI: "true"
      PAYOUT_BROWSER_CHANNEL: chrome

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/cyberbiz-monthly-payout/package-lock.json

      - name: 安裝相依套件
        run: npm ci

      - name: 產生 .env
        env:
          CYBERBIZ_USERNAME: ${{ secrets.CYBERBIZ_USERNAME }}
          CYBERBIZ_PASSWORD: ${{ secrets.CYBERBIZ_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          NAS_STORAGE_URL: ${{ secrets.NAS_STORAGE_URL }}
          NAS_STORAGE_TOKEN: ${{ secrets.NAS_STORAGE_TOKEN }}
          PLATFORM_API_URL: ${{ vars.WORKER_URL || 'https://platform.rueisiang.com' }}
          CYBERBIZ_REPORT_INGEST_TOKEN: ${{ secrets.CYBERBIZ_REPORT_INGEST_TOKEN }}
        run: |
          umask 077
          {
            echo "CYBERBIZ_USERNAME=$CYBERBIZ_USERNAME"
            echo "CYBERBIZ_PASSWORD=$CYBERBIZ_PASSWORD"
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            echo "GOOGLE_REFRESH_TOKEN=$GOOGLE_REFRESH_TOKEN"
            echo "GMAIL_REFRESH_TOKEN=$GMAIL_REFRESH_TOKEN"
            echo "NAS_STORAGE_URL=$NAS_STORAGE_URL"
            echo "NAS_STORAGE_TOKEN=$NAS_STORAGE_TOKEN"
            echo "PLATFORM_API_URL=$PLATFORM_API_URL"
            echo "CYBERBIZ_REPORT_INGEST_TOKEN=$CYBERBIZ_REPORT_INGEST_TOKEN"
          } > .env
          for key in CYBERBIZ_USERNAME CYBERBIZ_PASSWORD GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN GMAIL_REFRESH_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::$key 是空的，請到 Settings → Secrets 補齊"
              exit 1
            fi
          done

      - name: 檢查完整月份 manifest 設定
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          NAS_STORAGE_URL: ${{ secrets.NAS_STORAGE_URL }}
          NAS_STORAGE_TOKEN: ${{ secrets.NAS_STORAGE_TOKEN }}
          CYBERBIZ_REPORT_INGEST_TOKEN: ${{ secrets.CYBERBIZ_REPORT_INGEST_TOKEN }}
        run: |
          node --input-type=module -e '
            const [year, month] = process.env.START.split("-").map(Number);
            const lastDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
            const monthStart = `${year}-${String(month).padStart(2, "0")}-01`;
            const monthEnd = `${year}-${String(month).padStart(2, "0")}-${String(lastDay).padStart(2, "0")}`;
            if (process.env.START !== monthStart || process.env.END !== monthEnd) process.exit(0);
            const required = ["NAS_STORAGE_URL", "NAS_STORAGE_TOKEN", "CYBERBIZ_REPORT_INGEST_TOKEN"];
            const missing = required.filter((key) => !process.env[key]);
            if (missing.length) {
              console.warn(`::warning::完整月份將照常上傳 Drive，但不建立 AI manifest；缺少設定：${missing.join(", ")}`);
            }
          '

      - name: 執行商品銷售報表
        id: sales
        env:
          STORE: ${{ inputs.store }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          args=(--headless --start "$START" --end "$END")
          if [ "$STORE" != "全部" ]; then args+=(--store "$STORE"); fi
          echo "執行：node sales-driver.mjs ${args[*]}"
          set +e
          node sales-driver.mjs "${args[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: 把報告貼到執行摘要
        if: always()
        run: |
          for file in reports/*.md; do
            [ -e "$file" ] || continue
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: 保留產出的檔案
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberbiz-sales-${{ inputs.start }}-${{ inputs.end }}-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            tools/cyberbiz-monthly-payout/staging/**/*.xlsx
            tools/cyberbiz-monthly-payout/reports/*.md
            tools/cyberbiz-monthly-payout/screenshots/*.png

      - name: 有店沒完成就讓這次執行標記失敗
        if: always() && steps.sales.outputs.exit_code != '0'
        run: |
          echo "::error::有通路未完成，詳見上方摘要與 artifact"
          exit 1
